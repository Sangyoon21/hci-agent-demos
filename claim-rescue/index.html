<style>

.claim:has(.cite-1:hover) .quote-1, .claim:has(.cite-1:hover) .cite-1, .claim:has(.quote-1:hover) .cite-1, .claim[data-pin="1"] .quote-1, .claim[data-pin="1"] .cite-1 { outline: 2px solid var(--hl); background: var(--hl-soft) !important; }
.claim:has(.cite-2:hover) .quote-2, .claim:has(.cite-2:hover) .cite-2, .claim:has(.quote-2:hover) .cite-2, .claim[data-pin="2"] .quote-2, .claim[data-pin="2"] .cite-2 { outline: 2px solid var(--hl); background: var(--hl-soft) !important; }

.claim:has(.cite-8:hover) .quote-8, .claim:has(.cite-8:hover) .cite-8, .claim:has(.quote-8:hover) .cite-8, .claim[data-pin="8"] .quote-8, .claim[data-pin="8"] .cite-8 { outline: 2px solid var(--hl); background: var(--hl-soft) !important; }

.details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

    let text = (s.text || "").trim();
    const inline = [...text.matchAll(/\[(\d+)\]/g)].map(m => +m[1]);
    const cites = [...new Set([...(s.cites || []).filter(x => /^\d+$/.test(String(x))).map(Number), ...inline])].sort((a, b) => a - b);
    text = text.replace(/\s*\[\d+\]/g, "").trim();
    const kind = s.kind || "fact";
    if (!text) continue;
    const bad = cites.filter(c => c < 1 || c > nQuotes);
    if (bad.length) {
      dropped.push({text, reason: `cites [${bad.join(", ")}], which is not a verified quote`});
      events.push(ev("reject", "Draft check", `SENTENCE DROPPED (cites unverified quote [${bad.join(", ")}]): "${short(text)}"`));
      continue;
    }
    if (kind !== "framing" && !cites.length) {
      dropped.push({text, reason: "states a fact without citing any quote"});
      events.push(ev("reject", "Draft check", `SENTENCE DROPPED (factual, no citation): "${short(text)}"`));
      continue;
    }
    kept.push({text, cites, kind: cites.length ? kind : "framing"});
  }
  if (!dropped.length) events.push(ev("pass", "Draft check", `all ${kept.length} sentences cite verified quotes or are framing`));
  return [kept, dropped, events];
}
function attachmentsFor(sentences, selected, docs) {
  const nums = [...new Set(sentences.flatMap(s => s.cites))].sort((a, b) => a - b);
  const ids = [];
  for (const n of nums) { const d = selected[n - 1].doc_id; if (!ids.includes(d)) ids.push(d); }
  return ids.map(id => docs.find(d => d.doc_id === id));
}

// ------------------------------------------------------------------ mock model (port of mock_responses.py)
const mock = {
  classify: c => DATA.mock[c].classify,
  findProof: c => DATA.mock[c].find_proof || {candidates: [], no_evidence_reason: "No evidence found in the chart."},
  draft(c, claim, quotes, defaultSel) {
    if (defaultSel && DATA.mock[c].draft) return {sentences: DATA.mock[c].draft};
    const names = {prior_auth: "prior authorization record", visit_note: "visit note", referral: "referral",
      pt_note: "physical therapy note", lab_result: "test result"};
    const s = [{text: `We request reconsideration of claim ${claim.claim_id} for ${claim.service} on ${claim.visit_date}.`, cites: [], kind: "framing"}];
    quotes.forEach((q, i) => s.push({text: `The ${names[q.doc_type] || "medical record"} dated ${q.doc_date} states: “${q.quote}”`, cites: [i + 1], kind: "fact"}));
    s.push({text: "Based on this documentation, we ask that the claim be reprocessed and paid.", cites: [], kind: "framing"});
    return {sentences: s};
  },
  selfCheck(c, sentences, quotes) {
    const flags = [];
    sentences.forEach((s, i) => {
      if (!s.cites.length) return;
      const confs = s.cites.map(n => quotes[n - 1].confidence);
      if (c === 2 && s.text.includes("formal referral"))
        flags.push({sentence: i, severity: "unsupported", issue: "Quotes show an internal consult message and a plan note, not a formal referral form. 'Formal referral' overstates them."});
      else if (!confs.includes("high"))
        flags.push({sentence: i, severity: "weak", issue: `Cited evidence is indirect (confidence ${confs.map(x => x.toUpperCase()).join("/")}).`});
    });
    return {flags, overall: flags.length ? "needs_review" : "ok"};
  },
};

async function llmCall(system, user, mockFn) {
  const t0 = performance.now();
  await sleep(LATENCY_MS);
  const text = JSON.stringify(mockFn(), null, 2);
  const tin = estTokens(system + user), tout = estTokens(text);
  return {text, tin, tout, cost: (tin * PRICE.in + tout * PRICE.out) / 1e6, lat: (performance.now() - t0) / 1000, model: "mock", error: null};
}
const parseJson = t => { try { return JSON.parse(t); } catch (e) { return null; } };
function step(name, system, user, res, parsed, events) {
  if (parsed == null) events = [ev("reject", "JSON parse", "model output was not valid JSON"), ...events];
  return {name, system, user, raw: res.text, parsed, guard_events: events, input_tokens: res.tin, output_tokens: res.tout,
    cost_usd: res.cost, latency_s: res.lat, model: res.model, error: res.error};
}

// ------------------------------------------------------------------ agent (port of agent.py)
const P = DATA.prompts;
const chartForPrompt = docs => docs.map(d => `[${d.doc_id}] type=${d.doc_type} date=${d.visit_date} author=${d.author || ""}\n${d.text}`).join("\n\n");
const quotesForPrompt = qs => qs.map((q, i) => `[${i + 1}] (${q.doc_type}, ${q.doc_date}) "${q.quote}"`).join("\n");
const selected = r => r.selected_ids.map(id => r.candidates.find(c => c.id === id));

async function classify(claim) {
  const user = fmt(P.CLASSIFY_USER, claim);
  const res = await llmCall(P.CLASSIFY_SYSTEM, user, () => mock.classify(claim.case));
  const parsed = parseJson(res.text);
  let cat = (parsed || {}).category || "";
  const events = [];
  if (!DATA.inScope.concat(["out_of_scope"]).includes(cat)) {
    events.push(ev("warn", "Scope check", `unknown category '${cat}'; routing to normal queue`)); cat = "out_of_scope";
  } else if (cat === "out_of_scope") events.push(ev("info", "Scope check", "out of scope: route to normal billing queue, no appeal drafted"));
  else events.push(ev("pass", "Scope check", `in scope: ${CATEGORY_LABEL[cat]}`));
  return [step("1. Classify", P.CLASSIFY_SYSTEM, user, res, parsed, events), cat, (parsed || {}).rationale || ""];
}
async function findProof(claim, docs, category) {
  const user = fmt(P.FIND_PROOF_USER, {...claim, category, n_docs: docs.length, chart: chartForPrompt(docs)});
  const res = await llmCall(P.FIND_PROOF_SYSTEM, user, () => mock.findProof(claim.case));
  const parsed = parseJson(res.text) || {};
  const [cands, events] = validateCandidates((parsed.candidates || []).filter(c => c && typeof c === "object"), docs, claim);
  return [step("2. Find proof", P.FIND_PROOF_SYSTEM, user, res, parsed, events), cands, parsed.no_evidence_reason || ""];
}
async function draft(claim, quotes, defaultSel) {
  const user = fmt(P.DRAFT_USER, {...claim, quotes: quotesForPrompt(quotes)});
  const res = await llmCall(P.DRAFT_SYSTEM, user, () => mock.draft(claim.case, claim, quotes, defaultSel));
  const parsed = parseJson(res.text) || {};
  const [kept, dropped, events] = checkDraft((parsed.sentences || []).filter(s => s && typeof s === "object"), quotes.length);
  return [step("3. Draft appeal", P.DRAFT_SYSTEM, user, res, parsed, events), kept, dropped];
}
async function selfCheck(claim, quotes, sentences) {
  const sentTxt = sentences.map((s, i) => `${i}: [${s.cites.join(", ")}] ${s.text}`).join("\n");
  const user = fmt(P.SELF_CHECK_USER, {quotes: quotesForPrompt(quotes), sentences: sentTxt});
  const res = await llmCall(P.SELF_CHECK_SYSTEM, user, () => mock.selfCheck(claim.case, sentences, quotes));
  const parsed = parseJson(res.text) || {};
  const flags = [];
  for (const f of parsed.flags || []) {
    const idx = parseInt(f.sentence, 10);
    if (Number.isInteger(idx) && idx >= 0 && idx < sentences.length && sentences[idx].kind !== "framing")
      flags.push({sentence: idx, severity: f.severity || "weak", issue: f.issue || ""});
  }
  const events = flags.length ? flags.map(f => ev("warn", "Self-check", `sentence ${f.sentence + 1} flagged ${f.severity.toUpperCase()}: ${f.issue}`))
    : [ev("pass", "Self-check", "no weak or unsupported sentences flagged")];
  return [step("4. Self-check", P.SELF_CHECK_SYSTEM, user, res, parsed, events), flags];
}
function decideStatus(r) {
  const err = r.steps.find(s => s.error);
  if (err) { r.status = "Needs review"; r.banner = "An LLM call failed, so the agent stopped. " + err.error.slice(0, 160); return; }
  if (r.category === "out_of_scope") { r.status = "Out of scope"; r.banner = "Not an evidence problem. Routed to the normal billing queue."; return; }
  const accepted = r.candidates.filter(c => c.accepted);
  const idBlocked = r.candidates.filter(c => c.rejected_by === "Identity check");
  if (!accepted.some(c => CONF_RANK[c.confidence] <= 1)) {
    if (idBlocked.length) {
      r.status = "Needs review";
      r.banner = `Identity check blocked ${idBlocked.length} of ${r.candidates.length} quotes. They come from another patient's record or from outside the date window. No appeal drafted. Check for a misfiled document.`;
    } else { r.status = "No proof"; r.banner = r.no_evidence_reason || "No evidence found in the chart. No appeal drafted."; }
    return;
  }
  if (!r.draft.length) { r.status = "Needs review"; r.banner = "The draft was empty after the guards. See the agent trace."; }
  else if (r.flags.length || selected(r).some(q => q.confidence !== "high")) {
    r.status = "Needs review"; r.banner = "Some evidence is indirect or a sentence was flagged. Read the highlighted parts before approving.";
  } else {
    r.status = "Ready"; r.banner = "Every factual sentence cites a verified quote from this patient's chart.";
    if (r.dropped.length) r.banner += ` Guards removed ${r.dropped.length} unsupported sentence(s).`;
  }
}
function totals(r) {
  r.tokens_in = r.steps.reduce((a, s) => a + s.input_tokens, 0);
  r.tokens_out = r.steps.reduce((a, s) => a + s.output_tokens, 0);
  r.cost_usd = r.steps.reduce((a, s) => a + s.cost_usd, 0);
  r.llm_calls = r.steps.length;
}
async function draftAndCheck(r, note, defaultSel) {
  const quotes = selected(r);
  note("Drafting appeal");
  const [st, kept, dropped] = await draft(r.claim, quotes, defaultSel);
  r.steps.push(st); r.draft = kept; r.dropped = dropped;
  if (kept.length && !st.error) {
    note("Self-checking draft");
    const [st2, flags] = await selfCheck(r.claim, quotes, kept);
    r.steps.push(st2); r.flags = flags;
  } else r.flags = [];
}
async function runClaim(claim, note = () => {}) {
  const t0 = performance.now();
  const docs = DATA.charts[claim.patient_id];
  const r = {claim, backend: "mock", steps: [], candidates: [], selected_ids: [], draft: [], dropped: [], flags: [],
    no_evidence_reason: "", doctor_note: "", decision: null, category: null, rationale: ""};
  note("Classifying denial");
  let [st, cat, why] = await classify(claim);
  r.steps.push(st); r.category = cat; r.rationale = why;
  if (cat !== "out_of_scope" && !st.error) {
    note("Searching chart for proof");
    const [st2, cands, noev] = await findProof(claim, docs, cat);
    r.steps.push(st2); r.candidates = cands; r.no_evidence_reason = noev;
    const acc = cands.filter(c => c.accepted && (c.confidence === "high" || c.confidence === "medium"))
      .sort((a, b) => CONF_RANK[a.confidence] - CONF_RANK[b.confidence]);
    r.selected_ids = acc.slice(0, DATA.maxQuotes).map(c => c.id);
    if (r.selected_ids.length && !st2.error) await draftAndCheck(r, note, true);
  }
  decideStatus(r); totals(r);
  r.seconds = (performance.now() - t0) / 1000;
  return r;
}
async function redraft(r, ids) {
  const t0 = performance.now();
  const ok = new Set(r.candidates.filter(c => c.accepted).map(c => c.id));
  r.selected_ids = ids.filter(i => ok.has(i));  // a rejected quote can never be selected
  const n0 = r.steps.length;
  if (r.selected_ids.length) await draftAndCheck(r, () => {}, false);
  r.steps.slice(n0).forEach(s => s.name += " (re-draft after swap)");
  decideStatus(r); totals(r);
  r.seconds = (r.seconds || 0) + (performance.now() - t0) / 1000;
}
function letterText(r) {
  const c = r.claim;
  const body = r.draft.map(s => `${s.text} ${s.cites.map(n => `[${n}]`).join("")}`.trim()).join(" ");
  const refs = selected(r).map((q, i) => `[${i + 1}] ${q.doc_type} ${q.doc_date} (${q.doc_id}): "${q.quote}"`).join("\n");
  const parts = [`To: ${c.insurer}, Appeals Department`, `Re: Appeal of claim ${c.claim_id} (${c.insurer_code}), patient ${c.patient_name}, date of service ${c.visit_date}`, "", body];
  if (r.doctor_note) parts.push("", "Additional note from the treating physician:", r.doctor_note);
  parts.push("", "Cited evidence:", refs);
  return parts.join("\n");
}
function submit(r, atts) {  // simulated insurer submission: stays on this page
  const now = new Date();
  const p = {SIMULATED: "No data was sent to any insurer. This record stands in for an electronic appeal submission.",
    claim_id: r.claim.claim_id, patient_id: r.claim.patient_id, insurer: r.claim.insurer, approved_by: S.approver,
    approved_at: now.toISOString().slice(0, 19), letter: letterText(r), doctor_note: r.doctor_note || null,
    attachments: atts.map(d => ({doc_id: d.doc_id, doc_type: d.doc_type, visit_date: d.visit_date, text: d.text})),
    agent_backend: r.backend, agent_cost_usd: +r.cost_usd.toFixed(6)};
  S.outbox.unshift(p);
  return p;
}

// ------------------------------------------------------------------ rendering
const statusOf = cid => { const r = S.results[cid]; return !r ? "New" : (r.decision || r.status); };
const chip = s => `<span class="chip c-${s.split(" ")[0]}">${esc(s)}</span>`;

function renderTotals() {

function renderRail() {

function renderStepper(r) {
  const last = p => r.steps.filter(s => s.name.startsWith(p)).pop();
  const acc = r.candidates.filter(q => q.accepted).length, rej = r.candidates.filter(q => !q.accepted).length;
  const specs = [
    ["1", "Classify", last("1."), () => CATEGORY_LABEL[r.category] || "Failed", 0],
    ["2", "Find proof", last("2."), () => r.candidates.length ? `${acc} verified quote(s)` : "No evidence found", rej],
    ["3", "Draft appeal", last("3."), () => `${r.draft.length} sentences, each cited`, r.dropped.length],
    ["4", "Self-check", last("4."), () => r.flags.length ? `${r.flags.length} sentence(s) flagged` : "No sentences flagged", 0],
  ];
  let stopped = null;
  return `<div class="stepper">` + specs.map(([num, title, s, summary, caught]) => {
    if (!s) {
      const reason = stopped || (r.category === "out_of_scope" ? "Not needed: out of scope" : num === "3" ? "Stopped: no usable proof" : "Not run");
      stopped = stopped || reason;
      return `<div class="step skip"><div class="n">STEP ${num}</div><div class="t">${title}</div><div class="s">${reason}</div></div>`;
    }
    const cls = s.error ? "err" : ((num === "4" && r.flags.length) || (num === "2" && acc === 0)) ? "warn" : "ok";
    const badge = caught ? `<span class="caught">🛡 ${caught} caught</span>` : "";
    return `<div class="step ${cls}">${badge}<div class="n">STEP ${num}</div><div class="t">${title}</div><div class="s">${esc(s.error ? "Call failed (see trace)" : summary())}</div></div>`;
  }).join("") + `</div>`;
}

function quoteBox(q, num, kind = "sel") {
  const src = q.doc_type ? `📄 ${DOC_TYPE[q.doc_type] || q.doc_type} · ${q.doc_date} · ${esc(q.doc_author)}` : `📄 cited as <code>${esc(q.doc_id)}</code>`;
  const extra = kind === "rejected" ? `<div class="rej">🛡 ${esc(q.rejected_by)}: ${esc(q.reject_reason)}</div>` : `<div class="why">${esc(q.why_it_helps)}</div>`;
  const cls = kind === "sel" ? `quote-${num}` : kind;
  return `<div class="quote ${cls}" ${num ? `data-q="${num}"` : ""}><div class="meta"><span class="conf conf-${q.confidence}">${q.confidence.toUpperCase()}</span>${num ? `<span class="qnum">[${num}]</span>` : ""}</div>
    <div class="qtext">“${esc(q.quote)}”</div>${extra}<div class="src">${src}</div></div>`;
}

function highlightDoc(d, r, claim) {
  let text = esc(d.text);
  for (const q of r.candidates) {
    if (q.doc_id !== d.doc_id || !q.quote) continue;
    const cls = !q.accepted ? "bad" : r.selected_ids.includes(q.id) ? "sel" : "spare";
    const pat = q.quote.split(/\s+/).filter(Boolean).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s+");
    text = text.replace(new RegExp(`(${pat})`, "i"), `<mark class="${cls}">$1</mark>`);
  }
  const pid = d.patient_id === claim.patient_id ? `<span>patient ${d.patient_id}</span>` : `<span class="pid-bad">patient ${d.patient_id} ≠ ${claim.patient_id}</span>`;
  return `<div class="doc"><div class="dh"><b>${DOC_TYPE[d.doc_type] || d.doc_type}</b> · ${d.visit_date} · ${esc(d.author)} · ${pid} · <code>${d.doc_id}</code></div>${text}</div>`;
}

function renderClaim() {
  const c = byId[S.selected], cid = c.claim_id, r = S.results[cid], docs = DATA.charts[c.patient_id];
  const busy = S.busy === cid;
  let headBtn = "";
  if (busy) headBtn = `<div class="live">● ${esc(S.busyMsg || "Working")}…</div>`;
  else if (!r) headBtn = `<button class="btn primary" data-act="run" ${S.running ? "disabled" : ""}>▶ Run agent on this claim</button>`;
  else if (!r.decision) headBtn = `<button class="btn" data-act="run" title="Discard this result and run all 4 steps again" ${S.running ? "disabled" : ""}>↻ Re-run agent</button>`;
  let h = `<div class="head"><div><span class="cid">${cid}</span>${chip(statusOf(cid))}
    <div class="facts"><span><b>Patient</b>${esc(c.patient_name)} · ${c.patient_id}</span><span><b>Service</b>${esc(c.service)}</span>
    <span><b>Date of service</b>${c.visit_date}</span><span><b>Insurer</b>${esc(c.insurer)}</span><span class="num"><b>Amount</b>${money(c.amount, 2)}</span></div></div>${headBtn}</div>`;

  if (r) {
    h += renderStepper(r);
    if (r.decision === "Sent") h += `<div class="banner ok">📨 <span><b>Approved by ${esc(r.approved_by)}</b> at ${esc(r.approved_at)}. Simulated submission added to the outbox below. Nothing left this page.</span></div>`;
    else if (r.decision === "Rejected") h += `<div class="banner bad">✖ <span><b>Rejected by ${esc(r.approved_by)}:</b> ${esc(r.reject_reason)}. Moved to the normal billing queue.</span></div>`;
    const icon = {"Ready": "✅", "Needs review": "⚠️", "No proof": "🔎", "Out of scope": "↪️"}[r.status] || "ℹ️";
    const cls = {"Ready": "ok", "Needs review": "warn"}[r.status] || "info";
    h += `<div class="banner ${cls}">${icon} <span>${esc(r.banner)}</span></div>`;
  }

  // WHY
  const n = daysLeft(c);
  let why = `<div class="col"><div class="colhead">WHY IT WAS DENIED</div><div class="reason">${esc(c.reason_plain)}</div>
    <div class="codebox"><b>${esc(c.insurer_code)}</b><br>${esc(c.insurer_text)}</div>
    <div><span class="due ${n <= 7 ? "soon" : ""}">⏰ ${dueText(c)}</span></div>
    <div class="muted num">Appeal deadline ${c.deadline}<br>${money(c.amount, 2)} at stake</div>`;
  if (r && r.category && r.category !== "error")
    why += `<div class="sechead">Agent classified as</div><b>${CATEGORY_LABEL[r.category] || esc(r.category)}</b><div class="muted">${esc(r.rationale)}</div>`;
  why += `</div>`;

  // PROOF
  let proof = `<div class="col"><div class="colhead">PROOF FOUND</div>`;
  if (!r) proof += `<div class="letter empty">The agent will search ${docs.length} documents in this patient's chart.</div>`;
  else if (r.category === "out_of_scope") proof += `<div class="letter empty">Not searched. This denial is a billing issue, not missing evidence.</div>`;
  else {
    const sel = selected(r);
    proof += sel.length ? sel.map((q, i) => quoteBox(q, i + 1)).join("")
      : `<div class="quote"><b>🔎 No evidence found</b><div class="why">${esc(r.no_evidence_reason || "No usable quote survived the guards.")}</div></div>`;
    const spare = r.candidates.filter(q => q.accepted && !r.selected_ids.includes(q.id));
    if (spare.length) proof += `<div class="sechead">Also verified, not used · swap in with “Swap proof”</div>` + spare.map(q => quoteBox(q, null, "spare")).join("");
    const rej = r.candidates.filter(q => !q.accepted);
    if (rej.length) proof += `<div class="sechead red">🛡 Rejected by guards · never shown to the insurer</div>` + rej.map(q => quoteBox(q, null, "rejected")).join("");
    const used = new Set(r.candidates.map(q => q.doc_id));
    const srcDocs = docs.filter(d => used.has(d.doc_id));
    if (srcDocs.length) proof += `<details class="details" data-toggle="ctx" ${S.ctx ? "open" : ""}><summary>📄 See quotes in context (${srcDocs.length} of ${docs.length} chart documents)</summary>
      <div class="inner"><div class="muted"><mark class="sel">used</mark> · <mark class="spare">verified, not used</mark> · <mark class="bad">rejected</mark></div>
      ${srcDocs.map(d => highlightDoc(d, r, c)).join("")}</div></details>`;
  }
  proof += `</div>`;

  // DRAFT
  let dr = `<div class="col"><div class="colhead">DRAFT APPEAL</div>`;
  if (!r) dr += `<div class="letter empty">Run the agent to draft an appeal.</div>`;
  else if (!r.draft.length) {
    const idb = r.candidates.some(q => q.rejected_by === "Identity check");
    const msg = r.category === "out_of_scope" ? "No appeal. Routed to the normal billing queue."
      : idb ? "No appeal drafted. Every quote the agent found was blocked by the identity check (another patient's record, or outside the date window). Check the chart for a misfiled document."
      : r.status === "No proof" ? "No appeal drafted. The chart does not contain proof, and the agent never writes an appeal without evidence."
      : "No appeal drafted. See the banner and the agent trace.";
    dr += `<div class="letter empty">${esc(msg)}</div>`;
  } else {
    const flags = Object.fromEntries(r.flags.map(f => [f.sentence, f]));
    const parts = r.draft.map((s, i) => {
      let t = esc(s.text);
      if (flags[i]) t = `<span class="flag-${flags[i].severity}" title="${esc(flags[i].severity.toUpperCase() + ": " + flags[i].issue)}">${t}</span>`;
      return t + s.cites.map(k => `<button class="cite cite-${k}" data-act="pin" data-n="${k}" aria-label="Show quote ${k}">${k}</button>`).join("");
    });
    dr += `<div class="letter"><div class="hdr">To: ${esc(c.insurer)}, Appeals Department<br>Re: Claim ${cid} (${esc(c.insurer_code)}) · ${esc(c.patient_name)} · DOS ${c.visit_date}</div>${parts.join(" ")}`;
    if (r.doctor_note) dr += `<div class="drnote"><b>Note from the treating physician</b> <span class="muted">· written by ${esc(S.approver)}, inserted verbatim</span><br>${esc(r.doctor_note)}</div>`;
    dr += `<div class="sig">Signature is applied when a physician approves.</div></div>
      <div class="small">Hover or click a citation to highlight its quote. Amber = weak, red = unsupported (hover the sentence for why).</div>`;
    dr += r.flags.map(f => `<div class="note ${f.severity === "unsupported" ? "red" : "amber"}"><b>Self-check · sentence ${f.sentence + 1} · ${f.severity.toUpperCase()}</b><br>${esc(f.issue)}</div>`).join("");
    dr += r.dropped.map(d => `<div class="note red"><b>🛡 Removed by guard</b> · ${esc(d.reason)}<br><s>${esc(d.text)}</s></div>`).join("");
  }
  dr += `</div>`;
  h += `<div class="cols">${why}${proof}${dr}</div>`;

  // ACTIONS
  if (r && r.category !== "out_of_scope") {
    const decided = r.decision === "Sent" || r.decision === "Rejected";
    const pool = r.candidates.filter(q => q.accepted);
    const dis = c2 => (c2 || S.busy) ? "disabled" : "";
    h += `<div class="actions">
      <button class="btn primary" data-act="panel" data-p="approve" ${dis(decided || !r.draft.length)}>✅ Approve + send</button>
      <button class="btn" data-act="panel" data-p="swap" ${dis(decided || pool.length < 2)}>🔁 Swap proof</button>
      <button class="btn" data-act="panel" data-p="note" ${dis(decided || !r.draft.length)}>📝 Add a note</button>
      <button class="btn" data-act="panel" data-p="reject" ${dis(decided)}>✖ Reject</button></div>`;
    if (S.panel && !decided) h += renderPanel(r, docs, pool);
  }

  // TRACE
  if (r) {
    const tabs = r.steps.map((s, i) => {
      const nr = s.guard_events.filter(e => e.level === "reject").length, nw = s.guard_events.filter(e => e.level === "warn").length;
      return `<button class="tab ${i === S.traceTab ? "on" : ""}" data-act="tab" data-i="${i}">${esc(s.name)}${nr ? ` 🛡${nr}` : ""}${nw ? ` ⚠${nw}` : ""}</button>`;
    }).join("");
    const s = r.steps[Math.min(S.traceTab, r.steps.length - 1)];
    const stop = r.category === "out_of_scope" ? "Stopped after step 1: out of scope." : (!r.draft.length ? "Stopped after step 2: no usable proof survived the guards, so no appeal was drafted." : "");
    h += `<details class="details" data-toggle="trace" ${S.trace ? "open" : ""}><summary>🔍 Agent trace · ${r.llm_calls} LLM call(s) · ${r.tokens_in.toLocaleString()} in / ${r.tokens_out.toLocaleString()} out tokens · $${r.cost_usd.toFixed(5)} · ${r.seconds.toFixed(1)}s · mock</summary>
      <div class="inner"><div class="small">What the model was asked, what it returned, and what the deterministic guards did with it. Red lines are agent mistakes caught before the doctor saw them.</div>
      <div class="tabs" role="tablist">${tabs}</div>
      <div class="kpis"><div class="tile"><div class="l">Input tokens</div><div class="v">${s.input_tokens.toLocaleString()}</div></div>
        <div class="tile"><div class="l">Output tokens</div><div class="v">${s.output_tokens.toLocaleString()}</div></div>
        <div class="tile"><div class="l">Cost</div><div class="v">$${s.cost_usd.toFixed(6)}</div></div>
        <div class="tile"><div class="l">Latency</div><div class="v">${s.latency_s.toFixed(2)} s</div></div></div>
      <div class="sechead">Guard results</div>${s.guard_events.map(e => `<div class="ev ev-${e.level}">[${esc(e.guard)}] ${esc(e.msg)}</div>`).join("")}
      <div class="io"><div><div class="sechead">Prompt · model ${esc(s.model)}</div><pre class="code">${esc(`SYSTEM:\n${s.system}\n\nUSER:\n${s.user}`)}</pre></div>
        <div><div class="sechead">Raw model output</div><pre class="code">${esc(s.raw || s.error || "(empty)")}</pre></div></div>
      ${stop ? `<div class="small">${stop}</div>` : ""}</div></details>`;
  }
  return `<main class="claim" id="claim" ${S.pin ? `data-pin="${S.pin}"` : ""}>${h}</main>`;
}

function renderPanel(r, docs, pool) {
  if (S.panel === "approve") {
    const atts = attachmentsFor(r.draft, selected(r), docs);
    return `<div class="panel"><h3>Approve and send</h3><div><b>Signing as</b> ${esc(S.approver)}</div>
      <div><b>Attachments.</b> Only the documents cited in the letter:</div>
      <ul>${atts.map(d => `<li>${DOC_TYPE[d.doc_type] || d.doc_type} · ${d.visit_date} · <code>${d.doc_id}</code></li>`).join("")}</ul>
      <div class="small">The other ${docs.length - atts.length} chart document(s) are NOT sent.</div>
      ${r.flags.length ? `<div class="banner warn">⚠️ <span>${r.flags.length} sentence(s) are flagged. Consider Swap proof or Add a note first.</span></div>` : ""}
      <label class="chk"><input type="checkbox" id="ack" data-input="ack"> I have read the letter and checked the cited evidence.</label>
      <div class="row"><button class="btn primary" id="confirm" data-act="confirm" disabled>Confirm and send (simulated)</button><button class="btn" data-act="panel" data-p="">Cancel</button></div></div>`;
  }
  if (S.panel === "swap") {
    return `<div class="panel"><h3>Swap proof</h3><div class="small">Choose up to ${DATA.maxQuotes} verified quotes for the letter, then re-draft (steps 3 + 4 run again). Rejected quotes cannot be chosen.</div>
      ${pool.map(q => `<label class="chk"><input type="checkbox" name="swap" value="${q.id}" ${r.selected_ids.includes(q.id) ? "checked" : ""}> <span><span class="conf conf-${q.confidence}">${q.confidence.toUpperCase()}</span> ${esc(short(q.quote, 110))}</span></label>`).join("")}
      <div class="row"><button class="btn primary" data-act="redraft">Re-draft with this proof</button><button class="btn" data-act="panel" data-p="">Cancel</button></div></div>`;
  }
  if (S.panel === "note") {
    return `<div class="panel"><h3>Add a note</h3><div class="small">Your own words, added to the letter verbatim. The AI never writes medical notes.</div>
      <label for="drnote" class="small">Physician note</label><textarea id="drnote" rows="4" placeholder="e.g. I examined the patient on … and …">${esc(r.doctor_note)}</textarea>
      <div class="row"><button class="btn primary" data-act="savenote">Save note</button><button class="btn" data-act="panel" data-p="">Cancel</button></div></div>`;
  }
  if (S.panel === "reject") {
    return `<div class="panel"><h3>Reject</h3><label for="rreason" class="small">Reason</label><select id="rreason">
      ${["Evidence is not convincing", "Wrong patient / wrong record", "Will handle manually", "Not worth appealing"].map(x => `<option>${x}</option>`).join("")}</select>
      <div class="row"><button class="btn" data-act="reject">Reject and move to billing queue</button><button class="btn" data-act="panel" data-p="">Cancel</button></div></div>`;
  }
  return "";
}

function renderOutbox() {
  if (!S.outbox.length) return "";
  return `<details class="details outbox" open><summary>📨 Outbox (simulated) · ${S.outbox.length} submission(s). Nothing is sent anywhere.</summary><div class="inner">
    ${S.outbox.map(p => `<div class="small"><b>${p.claim_id}</b> · approved by ${esc(p.approved_by)} at ${p.approved_at} · ${p.attachments.length} attachment(s)</div><pre class="code">${esc(JSON.stringify(p, null, 2))}</pre>`).join("")}</div></details>`;
}

function render() {
  const app = document.getElementById("app");
  const y = window.scrollY;
  app.innerHTML = `<header class="appbar"><div class="brand">Claim Rescue<small>Denials → evidence-backed appeal drafts. A doctor approves every one.</small></div>
      <span class="badge"><i></i>Offline mock AI · canned responses</span></header>
    <div class="notice">This shareable version runs in your browser with the canned model responses from the demo's offline mode, so it needs no API key. The guards, status rules and approval flow are the same code paths, ported to JavaScript. The Python app can also call Claude or a local model.</div>
    ${renderTotals()}
    <div class="main">${renderRail()}${renderClaim()}</div>
    ${renderOutbox()}
    ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""}`;
  window.scrollTo(0, y);
}
let toastTimer;
function toast(msg) { S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2600); }

// ------------------------------------------------------------------ events
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const cid = S.selected, r = S.results[cid];
  if (act === "open") { S.selected = el.dataset.id; S.panel = null; S.traceTab = 0; S.pin = null; render(); }
  else if (act === "reset") { Object.assign(S, {results: {}, panel: null, traceTab: 0, pin: null, outbox: [], running: null, busy: null}); render(); }
  else if (act === "pin") { S.pin = S.pin === el.dataset.n ? null : el.dataset.n; document.getElementById("claim").dataset.pin = S.pin || ""; }
  else if (act === "tab") { S.traceTab = +el.dataset.i; render(); }
  else if (act === "panel") { const p = el.dataset.p || null; S.panel = p && p === S.panel ? null : p; render(); }
  else if (act === "run") {
    S.busy = cid; S.busyMsg = "Starting"; S.panel = null; S.traceTab = 0; render();
    const res = await runClaim(byId[cid], m => { S.busyMsg = m; render(); });
    S.results[cid] = res; S.busy = null; toast(`${cid}: ${res.status}`); render();
  }
  else if (act === "runall") {
    const fresh = denials.filter(c => !S.results[c.claim_id]);
    for (let i = 0; i < fresh.length; i++) {
      const c = fresh[i];
      S.running = {i, n: fresh.length, cid: c.claim_id, msg: "Starting"}; render();
      S.results[c.claim_id] = await runClaim(c, m => { S.running.msg = m; render(); });
    }
    S.running = null; toast(`Processed ${fresh.length} denial(s).`); render();
  }
  else if (act === "confirm") {
    const docs = DATA.charts[r.claim.patient_id];
    const p = submit(r, attachmentsFor(r.draft, selected(r), docs));
    Object.assign(r, {decision: "Sent", approved_by: S.approver, approved_at: p.approved_at.replace("T", " ").slice(0, 16)});
    S.panel = null; toast(`${cid} approved. Simulated submission added to the outbox.`); render();
  }
  else if (act === "redraft") {
    const ids = [...document.querySelectorAll('input[name="swap"]:checked')].map(x => x.value);
    if (!ids.length) { toast("Choose at least one quote."); render(); return; }
    S.busy = cid; S.busyMsg = "Re-drafting"; S.panel = null; render();
    await redraft(r, ids);
    S.busy = null; S.traceTab = r.steps.length - 1; toast("Re-drafted with the proof you chose."); render();
  }
  else if (act === "savenote") { r.doctor_note = document.getElementById("drnote").value.trim(); S.panel = null; toast("Note saved, inserted verbatim."); render(); }
  else if (act === "reject") {
    Object.assign(r, {decision: "Rejected", approved_by: S.approver, reject_reason: document.getElementById("rreason").value});
    S.panel = null; render();
  }
});
document.addEventListener("input", e => {
  const k = e.target.dataset.input;
  if (k === "approver") S.approver = e.target.value;
  if (k === "ack") document.getElementById("confirm").disabled = !e.target.checked;
});
document.addEventListener("change", e => {
  if (e.target.name === "swap") {
    const boxes = [...document.querySelectorAll('input[name="swap"]')];
    const n = boxes.filter(b => b.checked).length;
    boxes.forEach(b => { if (!b.checked) b.disabled = n >= DATA.maxQuotes; });
  }
});
document.addEventListener("toggle", e => {
  const k = e.target.dataset && e.target.dataset.toggle;
  if (k === "ctx") S.ctx = e.target.open;
  if (k === "trace") S.trace = e.target.open;
}, true);
render();
</script>

</body></html>
